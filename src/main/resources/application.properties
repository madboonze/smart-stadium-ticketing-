spring.application.name=smart-stadium
server.port=8080
smartstadium.admin.email=${SMART_STADIUM_ADMIN_EMAIL:}
smartstadium.admin.password=${SMART_STADIUM_ADMIN_PASSWORD:}

# --- Module 6: persistence ---------------------------------------------------------
# SQLite file under data/, which .gitignore already excludes. Delete the file to start
# from an empty database; the seed inventory is rebuilt on the next start.
spring.datasource.url=jdbc:sqlite:${SMART_STADIUM_DB:data/smart-stadium.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite allows a single writer at a time, so the pool is kept to one connection. With
# more, concurrent writes fail with SQLITE_BUSY instead of queuing.
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Flyway owns the schema. Hibernate must not try to create or alter it: SQLite's ALTER
# TABLE is too limited for Hibernate's schema updates to be safe.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Set to false to start with an empty stadium instead of the seeded demo bowl. Seeding
# only ever runs when the database has no stadiums in it.
smartstadium.inventory.seed-demo-bowl=true
